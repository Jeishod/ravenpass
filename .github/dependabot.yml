version: 2

updates:
  - package-ecosystem: gomod
    directories:
      - /apps/desktop
      - /apps/mobile
      - /packages/app
      - /packages/authenticator
      - /packages/importers
      - /packages/vault
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    # The Wails Go module and @wailsio/runtime must move to the same version together.
    ignore:
      - dependency-name: github.com/wailsapp/wails/v3
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
      prefix-development: build
    ignore:
      - dependency-name: "@wailsio/runtime"
    groups:
      npm-production:
        dependency-type: production
      npm-development:
        dependency-type: development

  - package-ecosystem: gradle
    directory: /apps/mobile/build/android
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
